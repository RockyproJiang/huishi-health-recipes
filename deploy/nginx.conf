# 慧食图谱 · Nginx 站点配置（纯反向代理版）
#
# 这个版本不依赖 nginx 直接读项目文件，所以：
#   - 项目放在 /home/ubuntu/... 这种 www-data 进不去的目录也没问题
#   - 不用 chmod 改 /home 的权限
#   - .png → .webp 的回退由 Flask 的 serve_static() 负责
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/huishi
#   sudo nano /etc/nginx/sites-available/huishi     # 改 server_name
#   sudo ln -sf /etc/nginx/sites-available/huishi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream huishi_app {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # 改成你的域名；没有域名就写服务器公网 IP
    server_name your-domain.com;

    # 上传头像 / 舌象照片，最大 10MB
    client_max_body_size 10m;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # 全部交给 Flask：静态文件、webp 回退、接口都在里面
    location / {
        proxy_pass http://huishi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 舌诊走视觉模型，首次 10–22 秒，别缩
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # 静态资源加一层浏览器缓存（响应头仍然来自 Flask）
    location ~* ^/static/ {
        proxy_pass http://huishi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server_tokens off;
}
